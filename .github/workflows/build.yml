on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0

  # ZMK's reusable build workflow only uploads the .uf2 files as a CI
  # artifact ("firmware"); it does NOT create GitHub Releases. This job
  # re-attaches those .uf2 files to a GitHub Release when a tag is pushed
  # (e.g. v1.0.0), restoring the behavior the repo had before switching to
  # the reusable workflow.
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Repack firmware into single zip
        run: |
          cd firmware
          zip -r ../firmware.zip .

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}