CONFIG_ZMK_SLEEP=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
# ZMK Studio is intentionally NOT enabled here. This global file is applied to
# every tdh70 shield build (both split halves AND the central dongle). Studio
# runs on the central dongle only, so it is set in
# config/boards/shields/tdh70/tdh70_dongle.conf instead.
