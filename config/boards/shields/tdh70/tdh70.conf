# Uncomment the following line to enable the TDH70 OLED Display
# CONFIG_ZMK_DISPLAY=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_ZMK_STUDIO is intentionally not set in this base conf, which applies to
# every tdh70 variant. Studio runs on the central dongle (the firmware that
# connects to the PC and holds keymap state), so it is enabled in
# tdh70_dongle.conf. The left/right split halves are peripherals and build
# without Studio.
