CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SLEEP=n
# CONFIG_PM_DEVICE=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y

# ZMK Studio on the central dongle only: the dongle is the controller connected
# to the PC over USB and holds the keymap state/settings. Matches the
# studio-rpc-usb-uart snippet for the dongle build in build.yaml. The left/right
# split halves build without CONFIG_ZMK_STUDIO.
CONFIG_ZMK_STUDIO=y