---
include:
  # ZMK Studio runs on the central dongle only: it is the controller connected
  # to the PC over USB and the one holding keymap state/settings. The left/right
  # halves are split peripherals and are built without Studio.
  - board: nice_nano_v2_flipped
    shield: tdh70_left
  - board: nice_nano_v2_flipped
    shield: tdh70_right
  - board: nice_nano_v2_flipped
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: tdh70_dongle
    snippet: studio-rpc-usb-uart
  - board: seeeduino_xiao_ble
    shield: settings_reset
